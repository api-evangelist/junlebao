name: Junlebao
description: 'Junlebao Dairy Group (Shijiazhuang Junlebao Dairy Co., Ltd., 君乐宝乳业)
  is one of China''s largest dairy processors, founded in 1995 and headquartered in
  Shijiazhuang, Hebei Province. Its business spans the full dairy value chain: infant
  and toddler formula, low-temperature (chilled) yogurt, room-temperature liquid milk,
  fresh milk, cheese and dairy-farming/animal-husbandry operations. Junlebao is the
  largest dairy company in Hebei and ranks among China''s top dairy producers, leading
  domestic infant-formula sales volume and holding a top position in low-temperature
  yogurt. It was surfaced in the API Evangelist network as a portfolio company of Hongshan
  (HSG). As a consumer packaged-goods / food manufacturer it publishes no public developer
  program, API, or open-data surface; this profile tracks its corporate web presence
  and company identity.'
